; MCUME espvcs (Atari 2600) -> TTGO VGA32 + ponte T-Display
; framework = arduino. Video (FabGL VGADirectController) e teclado PS/2 (FabGL).
; Camada de plataforma reaproveitada do esp64 (C64); core de emulacao do espvcs.

[platformio]
default_envs = vga32

[env:vga32]
platform  = espressif32@6.12.0
framework = arduino
board     = esp32dev

board_build.f_cpu       = 240000000L
board_build.flash_mode  = qio
board_build.f_flash     = 80000000L
board_build.partitions  = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

lib_deps =
    fdivitto/FabGL @ ^1.0.9


build_src_filter = +<*>

; PSRAM DESLIGADA de proposito (mesma decisao do esp64): o framebuffer precisa
; de DRAM interna (o DMA nao le PSRAM), e habilitar PSRAM obriga o
; -mfix-esp32-psram-cache-issue, que custa ~30% de desempenho neste tipo de
; emulador. -Os em vez de -O2 porque o gargalo e' busca de instrucao na flash,
; nao trabalho de CPU: binario menor = menos erro de cache.
;   -DBOARD_HAS_PSRAM
;   -mfix-esp32-psram-cache-issue
build_flags =
    ; Core do 2600 e' flash-fetch-bound (o -O2 nao mudou o "2600=" da
    ; telemetria). Voltamos ao -Os -- binario menor = o mainloop cabe melhor na
    ; IRAM (ver IRAM_ATTR no Cpu.c) e sobra mais icache para o resto do core.
    -Os
    ; O core do 2600 declara varias funcoes como "__inline" sem static/extern
    ; (bank_switch_read/write, reset_vector, tv_rasterise, draw_vector_q, ...).
    ; Sob a semantica de inline do C99/gnu11 (padrao atual), uma funcao inline
    ; assim NAO emite simbolo externo; com -Os o compilador as vezes NAO faz o
    ; inline, e o simbolo some no link. O build original (ESP-IDF, -O2) inlinava
    ; tudo e nunca precisou. -fgnu89-inline restaura a semantica antiga, em que
    ; "__inline" emite a definicao out-of-line. Os headers do 2600 so' tem
    ; prototipos inline (sem corpo), entao nao ha risco de simbolo duplicado.
    -fgnu89-inline
    -Wno-error
    -Wno-implicit-int
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-unused-function
    -Wno-char-subscripts
    -Wno-format
    -Wno-write-strings
    -Wno-deprecated-declarations
    -Wno-narrowing